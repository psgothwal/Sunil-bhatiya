<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunil Bhatia</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% 28%,rgba(170,255,0,.08),transparent 25%),
             linear-gradient(180deg,#030303 0%,#080a02 55%,#020202 100%);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;
  background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);
  background-size:51px 51px;
}
.container{width:min(620px,100%);margin:auto;padding:32px 18px 25px;position:relative}
.hero{text-align:center}
.logo{width:230px;height:230px;margin:0 auto 25px;border-radius:50%;overflow:hidden;
       box-shadow:0 0 28px rgba(170,255,0,.32)}
.logo img{width:100%;height:100%;display:block;object-fit:cover}
h1{margin:0;color:#ffc400;font-size:43px;line-height:1.08;font-weight:700}
.subtitle{margin:15px 0 26px;color:#ffc400;font-size:24px;font-weight:600}
.badges{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:30px}
.badge{border:2px solid #ffc400;border-radius:30px;padding:11px 24px;color:#ffc400;
        font-size:18px;font-weight:700;background:rgba(0,0,0,.35)}
.badge.red{border-color:#ff3038;color:#ff3038}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:50px}
.card{min-height:148px;border:2px solid #222;border-radius:20px;background:#0b0b0b;
       display:flex;flex-direction:column;justify-content:center;align-items:center}
.card:nth-child(2){border-color:#7d2424}
.num{font-size:31px;font-weight:800;color:#ffc400}
.card:nth-child(2) .num{color:#ff4545}
.label{font-size:17px;color:#8e8e8e;margin-top:12px}
.cta{display:flex;align-items:center;justify-content:center;gap:15px;width:100%;
      padding:25px 20px;border:0;border-radius:27px;text-decoration:none;color:#fff;
      font-size:27px;font-weight:800;background:linear-gradient(90deg,#20a83f 0%,#b55b31 48%,#e52b2b 100%);
      box-shadow:0 10px 35px rgba(0,0,0,.35);margin-bottom:58px}
.features{border:2px solid #292929;border-radius:25px;padding:28px 16px;display:grid;
           grid-template-columns:repeat(4,1fr);gap:10px;background:rgba(8,8,8,.65)}
.feature{text-align:center;color:#999;font-size:16px}
.icon{display:block;font-size:39px;line-height:1;margin-bottom:17px}
.green{color:#47c967}.yellow{color:#ffc400}.redtxt{color:#ff4350}
footer{text-align:center;color:#444;margin-top:70px;font-size:16px;line-height:1.8}
@media(max-width:520px){
 .container{padding-top:28px} .logo{width:215px;height:215px}
 h1{font-size:39px} .subtitle{font-size:21px}
 .badge{font-size:16px;padding:10px 18px} .stats{gap:10px}
 .card{min-height:128px} .num{font-size:25px} .label{font-size:15px}
 .cta{font-size:23px;padding:22px 14px} .features{padding:25px 8px}
 .feature{font-size:13px} .icon{font-size:33px}
}
</style>
</head>
